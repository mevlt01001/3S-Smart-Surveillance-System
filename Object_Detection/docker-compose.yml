version: '3.8'

services:
  triton:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    container_name: triton_yoloe_server
    restart: unless-stopped
    ports:
      - "8000:8000"   # HTTP REST API
      - "8001:8001"   # gRPC API (Yüksek Hızlı)
      - "8002:8002"   # Metrics (Prometheus)
    volumes:
      - ./model_repository:/models
    command: ["tritonserver", "--model-repository=/models", "--log-verbose=0"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: '1gb'
    ulimits:
      memlock: -1
      stack: 67108864
